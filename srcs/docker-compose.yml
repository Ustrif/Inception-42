services:
  nginx:
    build: ./nginx/Dockerfile
    container_name: nginx
    restart: always
    ports:
    - 443:443
  wordpress:
    build: ./wordpress/Dockerfile
    container_name: wordpress
    restart: always
  mariadb:
    build: ./mariadb/Dockerfile
    container_name: mariadb
    restart: always

volumes:
  wordpress_database:
  
  wordpess_files:

network:
